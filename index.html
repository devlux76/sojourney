<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Sojourney</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#0b2a4a" />
    <style>
      body { margin: 0; overflow: hidden; width: 100vw; height: 100vh; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      #hud { position: fixed; top: 8px; left: 8px; padding: 6px 8px; background: rgba(0,0,0,0.55); color: #e8e8e8;
             font: 12px/1.4 monospace; white-space: pre; pointer-events: none; border-radius: 4px; }
      #settings { position: fixed; top: 8px; right: 8px; padding: 8px 10px; background: rgba(0,0,0,0.7); color: #e8e8e8;
                  font: 12px/1.4 monospace; border-radius: 4px; display: grid; gap: 4px; }
      #settings[hidden] { display: none; }
      #settings label { display: grid; grid-template-columns: 16em 10em 4em; align-items: center; gap: 6px; }
      #settings output { text-align: right; }
      #settings button { margin-top: 4px; font: inherit; }
      #settings .settings-choice { display: grid; grid-template-columns: 16em 1fr; align-items: center; gap: 6px; }
      #settings .settings-choice button { margin: 0; padding: 2px 8px; background: rgba(255,255,255,0.05);
                                          color: #e8e8e8; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; }
      #settings .settings-choice button.selected { border-color: #e0b060; background: rgba(224,176,96,0.14); color: #f0ece4; }
      /* The reticle is the outline of the possible action's glyph, and is absent when there is nothing to do. */
      #play-reticle { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center;
                      pointer-events: none; }
      #play-reticle span { display: block; font-size: 26px; line-height: 1;
                           filter: url(#glyph-outline) drop-shadow(0 0 1px rgba(0,0,0,0.7)); }
      #play-reticle small { display: block; margin-top: 3px; color: rgba(255,255,255,0.8); font: 11px sans-serif;
                            text-shadow: 0 0 2px rgba(0,0,0,0.8); }
      #play-hint { position: fixed; left: 50%; top: calc(50% + 44px); transform: translateX(-50%); padding: 3px 8px;
                   background: rgba(0,0,0,0.45); color: #f0ece4; font: 14px/1.4 sans-serif; border-radius: 4px;
                   white-space: pre; pointer-events: none; }
      #play-card { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); padding: 10px 18px;
                   background: rgba(20,24,20,0.75); color: #f0ece4; font: 16px/1.5 sans-serif; text-align: center;
                   border-radius: 6px; white-space: pre; pointer-events: none; }
      #play-announce { position: fixed; left: 50%; top: 12%; transform: translateX(-50%); padding: 8px 16px;
                       background: rgba(20,24,20,0.75); color: #f0ece4; font: 16px/1.5 sans-serif; text-align: center;
                       border-radius: 6px; white-space: pre; pointer-events: none; }
      #play-pack { position: fixed; left: 8px; bottom: 8px; padding: 8px 10px; background: rgba(0,0,0,0.7); color: #e8e8e8;
                   font: 12px/1.5 monospace; border-radius: 4px; white-space: pre; pointer-events: none; }
      #hud, #play-reticle, #play-hint, #play-pack, #play-card { transition: opacity 0.4s; }
      body.resting :is(#hud, #play-reticle, #play-hint, #play-pack, #play-card),
      body.hud-off :is(#hud, #play-reticle, #play-hint, #play-pack, #play-card) { opacity: 0; pointer-events: none; }

      body:not(.touch) :is(#touch-stick, #touch-cluster, #touch-sheet, #touch-sheet-toggle) { display: none; }
      #touch-stick { position: fixed; left: 18px; bottom: 18px; width: 132px; height: 132px; border-radius: 50%;
                     background: rgba(0,0,0,0.22); border: 1px solid rgba(255,255,255,0.16);
                     touch-action: none; z-index: 4; }
      #touch-stick .knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
                           border-radius: 50%; background: rgba(240,236,228,0.32); border: 1px solid rgba(255,255,255,0.3);
                           transition: transform 0.05s linear; }

      #touch-cluster { position: fixed; right: 18px; bottom: 18px; width: 180px; height: 180px; z-index: 4; }
      @media (orientation: portrait) {
        #touch-stick { left: 26px; bottom: 26px; width: 140px; height: 140px; }
        #touch-cluster { width: 210px; height: 210px; right: 26px; bottom: 26px; }
      }
      .touch-btn { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px;
                   border-radius: 50%; display: flex; align-items: center; justify-content: center;
                   background: rgba(0,0,0,0.45); color: #f0ece4; border: 1px solid rgba(255,255,255,0.2);
                   font: 22px/1 sans-serif; touch-action: none; user-select: none; -webkit-user-select: none;
                   -webkit-tap-highlight-color: transparent; }
      .touch-btn.jump { width: 64px; height: 64px; margin: -32px 0 0 -32px; font-size: 26px; }
      .touch-btn.dive { transform: translate(-26px, 36px); }
      .touch-btn[data-slot="0"] { transform: translate(-26px, -88px); }
      .touch-btn[data-slot="1"] { transform: translate(36px, -26px); }
      .touch-btn[data-slot="2"] { transform: translate(-26px, 36px); }
      .touch-btn[data-slot="3"] { transform: translate(-88px, -26px); }
      .touch-btn.holding { border-color: #e0b060; }
      .touch-btn:active { background: rgba(224,176,96,0.3); }
      .touch-btn[hidden], #touch-cluster [hidden] { display: none; }

      #touch-sheet-toggle { position: fixed; top: 8px; right: 8px; width: 46px; height: 32px; z-index: 6;
                            background: rgba(0,0,0,0.55); color: #e8e8e8; border: 1px solid rgba(255,255,255,0.18);
                            border-radius: 6px; font: 16px/1 sans-serif; touch-action: manipulation; }
      #touch-sheet { position: fixed; top: 46px; right: 8px; width: 176px; padding: 6px; display: grid; gap: 4px; z-index: 6;
                     background: rgba(0,0,0,0.7); border-radius: 6px;
                     max-height: calc(100vh - 54px); overflow-y: auto; box-sizing: border-box; }
      #touch-sheet[hidden] { display: none; }
      #touch-sheet button { padding: 7px 8px; background: rgba(255,255,255,0.05); color: #e8e8e8;
                            border: 1px solid rgba(255,255,255,0.12); border-radius: 4px; font: 12px/1.3 monospace;
                            text-align: left; white-space: pre; touch-action: manipulation; }
      #touch-sheet button.held { border-color: #e0b060; background: rgba(224,176,96,0.14); color: #f0ece4; }

      #destination { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                      padding: 24px; box-sizing: border-box; z-index: 10; overflow-y: auto;
                      background: radial-gradient(ellipse at 50% 30%, #16241f 0%, #090c0a 70%);
                      color: #f0ece4; font: 16px/1.5 sans-serif; }
      #destination-panel { margin: auto; width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center;
                            background: rgba(12, 16, 13, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
                            border: 1px solid rgba(224, 176, 96, 0.22); border-radius: 20px;
                            padding: 28px 22px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
      #soundcheck { position: fixed; inset: 0; display: flex; padding: 24px; box-sizing: border-box; z-index: 11; overflow-y: auto;
                    background: radial-gradient(ellipse at 50% 30%, #16241f 0%, #090c0a 70%); color: #f0ece4; font: 16px/1.5 sans-serif; }
      #soundcheck-panel { margin: auto; width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 12px;
                          background: rgba(12, 16, 13, 0.6); border: 1px solid rgba(224, 176, 96, 0.22); border-radius: 20px;
                          padding: 28px 22px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
      #soundcheck-panel h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: 0.02em; text-align: center; }
      #soundcheck-panel > p { margin: 0 0 4px; font-size: 14px; opacity: 0.8; text-align: center; }
      .soundcheck-option { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 2px solid transparent;
                           border-radius: 14px; background: rgba(255,255,255,0.04); cursor: pointer; }
      .soundcheck-option.selected { border-color: #e0b060; background: rgba(224,176,96,0.08); }
      .soundcheck-option.unavailable { cursor: default; }
      .soundcheck-option.unavailable h2 { opacity: 0.6; }
      .soundcheck-option > div { flex: 1; }
      .soundcheck-option h2 { margin: 0 0 2px; font-size: 16px; font-weight: 600; }
      .soundcheck-option p { margin: 0; font-size: 13px; opacity: 0.8; }
      .soundcheck-option button { padding: 8px 14px; font: 600 14px sans-serif; border-radius: 8px; cursor: pointer;
                                  border: 1px solid rgba(224,176,96,0.5); background: transparent; color: #f0ece4; }
      .soundcheck-option button:disabled { opacity: 0.4; cursor: default; }
      #soundcheck-panel > p.soundcheck-notice { padding: 10px 12px; border-radius: 10px; background: rgba(224,160,96,0.14);
                                                 color: #f0c890; opacity: 1; }
      #soundcheck-voices { display: flex; flex-direction: column; gap: 12px; }
      #soundcheck-voices[hidden] { display: none; }
      #soundcheck-voices > p { margin: 0 0 4px; font-size: 14px; opacity: 0.8; text-align: center; }
      .soundcheck-volume { display: flex; align-items: center; gap: 12px; font-size: 14px; }
      .soundcheck-volume input { flex: 1; }
      #soundcheck-continue { padding: 12px 0; font: 600 16px sans-serif; border-radius: 10px; border: none;
                             background: #e0b060; color: #14100a; cursor: pointer; }
      #destination-panel h1 { margin: 0 0 18px; font-size: 19px; font-weight: 600; letter-spacing: 0.02em; text-align: center; }
      .destination-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; width: 100%; margin-bottom: 20px; }
      .destination-card { width: 100%; border: 2px solid transparent; border-radius: 14px; background: rgba(255,255,255,0.04);
                           cursor: pointer; text-align: left; overflow: hidden; transition: border-color 0.15s, background 0.15s; }
      .destination-card.selected { border-color: #e0b060; background: rgba(224,176,96,0.08); }
      .destination-card img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; background: #1a1f28; }
      .destination-card .info { padding: 12px 16px 14px; }
      .destination-card h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
      .destination-card p { margin: 0; font-size: 14px; opacity: 0.8; }
      .destination-card .size { margin-top: 8px; font-size: 12px; opacity: 0.65; }
      #destination-enter { width: 100%; padding: 12px 0; font: 600 16px sans-serif; border-radius: 10px; border: none;
                            background: #e0b060; color: #1a1408; cursor: pointer; }
      #destination-enter:disabled { opacity: 0.6; cursor: default; }
      #destination-progress { margin-top: 14px; width: 100%; height: 6px; border-radius: 3px;
                               background: rgba(255,255,255,0.12); overflow: hidden; }
      #destination-progress .fill { height: 100%; width: 0; background: #e0b060; transition: width 0.15s linear; }
      #destination-error { margin: 12px 0 0; font-size: 13px; color: #e0a060; text-align: center; }
      @media (max-height: 520px) {
        #destination { padding: 10px; }
        #destination-panel { padding: 14px 16px 14px; border-radius: 14px; }
        #destination-panel h1 { margin: 0 0 10px; font-size: 16px; }
        .destination-cards { gap: 10px; margin-bottom: 12px; }
        .destination-card img { aspect-ratio: 16 / 6; }
        .destination-card .info { padding: 8px 12px 10px; }
        .destination-card h2 { font-size: 15px; }
        .destination-card p { font-size: 13px; }
        .destination-card .size { margin-top: 5px; }
        #destination-enter { padding: 10px 0; font-size: 15px; }
        #destination-progress { margin-top: 10px; }
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="hud"></div>
    <!-- Turns a glyph into a white line around its shape: the shape grown by a pixel and a half, minus the shape. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="glyph-outline">
        <feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="grown" />
        <feComposite in="grown" in2="SourceAlpha" operator="out" result="edge" />
        <feFlood flood-color="#fff" />
        <feComposite in2="edge" operator="in" />
      </filter>
    </svg>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
